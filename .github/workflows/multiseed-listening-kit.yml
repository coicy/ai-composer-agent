name: Multiseed human blind-review listening kit
on:
  push:
    branches: [experiment/clamp3-c2-multiseed]
    paths:
      - .github/workflows/multiseed-listening-kit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install GM synthesizer and MIDI parser
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y fluidsynth fluid-soundfont-gm ffmpeg
          python -m pip install 'mido>=1.3,<2' 'numpy>=1.26,<3'
      - name: Validate MIDI and listening-kit code
        run: |
          python -m unittest discover -s experiments/motif-development -p 'test_multiseed*.py' -v
          python experiments/motif-development/multiseed_export.py --out /tmp/multiseed-stimuli
      - name: Render 24 event-matched blind-review MP3 files
        run: |
          set -euo pipefail
          sf2=/usr/share/sounds/sf2/FluidR3_GM.sf2
          test -f "$sf2"
          mkdir -p /tmp/multiseed_mp3
          for seed in $(seq -w 0 11); do
            number=$((10#$seed))
            case "$((number % 3))" in
              0) changed=swap ;;
              1) changed=reverse ;;
              2) changed=rotate ;;
            esac
            for kind in ordered "$changed"; do
              id="motif_${seed}_${kind}"
              fluidsynth -ni "$sf2" "/tmp/multiseed-stimuli/midi/${id}.mid" \
                -F "/tmp/${id}.wav" -r 22050 >/dev/null
              ffmpeg -hide_banner -loglevel error -y \
                -i "/tmp/${id}.wav" -ar 22050 -ac 2 \
                -codec:a libmp3lame -b:a 96k "/tmp/multiseed_mp3/${id}.mp3"
              rm "/tmp/${id}.wav"
            done
          done
      - name: Randomize clips and save separate sealed answer key
        run: |
          python experiments/motif-development/multiseed_blind.py prepare \
            --audio /tmp/multiseed_mp3 \
            --out /tmp/multiseed-reviewers \
            --key /tmp/multiseed-private/answer_key.json
          test "$(find /tmp/multiseed-reviewers -name '*.mp3' | wc -l)" -eq 24
          test "$(find /tmp/multiseed-reviewers -name 'rating_block_*.csv' | wc -l)" -eq 12
      - uses: actions/upload-artifact@v4
        with:
          name: multiseed-human-blind-reviewer-kit
          path: /tmp/multiseed-reviewers/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: multiseed-human-blind-researcher-key
          path: /tmp/multiseed-private/answer_key.json
          retention-days: 30
