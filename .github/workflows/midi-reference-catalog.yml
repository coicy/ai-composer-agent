name: Curated MIDI Reference Catalog
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_midi_reference_catalog.py'
      - 'scripts/midi_reference_facets.py'
      - 'scripts/test_midi_reference_facets.py'
      - 'scripts/query_midi_references.py'
      - 'docs/MIDI_STYLE_TAXONOMY_REVIEW.md'
      - '.github/workflows/midi-reference-catalog.yml'
permissions:
  contents: read
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'mido==1.3.3'
      - name: Validate facet extraction with synthetic MIDI fixtures
        run: python -m unittest discover -s scripts -p 'test_midi_reference_facets.py' -v
      - name: Download, select and audit 2-3 MIDI per style
        run: python scripts/build_midi_reference_catalog.py
      - name: Validate manifest and MIDI counts
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          p=pathlib.Path('scripts/reference-output/manifest.json')
          data=json.loads(p.read_text())
          assert all(2<=v<=3 for k,v in data['style_counts'].items() if not k.startswith('meter_'))
          assert data['total_styles']==sum(1 for k in data['style_counts'] if not k.startswith('meter_'))
          assert data['total_sampling_buckets']==len(data['style_counts'])
          assert data['style_counts']['meter_6_8']==3
          assert data['style_counts']['meter_5_4']==1
          assert data['style_counts']['meter_5_8']==1
          assert len(data['items'])==sum(data['style_counts'].values())
          assert len(set(x['sha256'] for x in data['items']))==len(data['items']), 'duplicate MIDI files'
          assert data['total_styles']>=10, data['style_counts']
          assert data['total_files']>=25
          assert data['facets_schema']=='ai-composer-reference-facets-v1'
          coverage=json.loads(pathlib.Path('scripts/reference-output/coverage.json').read_text())
          assert coverage['total_midi']==data['total_files']
          assert coverage['capabilities']['drum_only']+coverage['capabilities']['pitched_material']==data['total_files']
          assert coverage['capabilities']['expert_verified_mode']==0, 'unreviewed inferred mode'
          assert coverage['capabilities']['expert_verified_groove']==0, 'unreviewed inferred groove'
          assert all(item['facets']['labels']['verified_mode'] is None for item in data['items'])
          assert coverage['capabilities']['drum_only']>=1
          assert coverage['capabilities']['pitched_material']>=1
          assert sum(coverage['observed_meters'].values())>=data['total_files']-coverage['capabilities']['meter_unknown']
          assert pathlib.Path('scripts/reference-output/COVERAGE.md').is_file()
          from scripts.query_midi_references import select_references
          assert select_references(data,meter='6/8')['match_count']>=3
          assert select_references(data,meter='5/4')['match_count']>=1
          assert select_references(data,meter='5/8')['match_count']>=1
          assert select_references(data,meter='7/8')['match_count']==0
          assert select_references(data,usage='battle')['match_count']==2
          assert select_references(data,source_style='dance/disco')['match_count']>=1
          assert select_references(data,meter='3/4',pitched=True)['match_count']>=2
          print('REFERENCE_QUERY_EXAMPLES_PASSED')
          print('FACET_CAPABILITIES',coverage['capabilities'])
          print('MISSING_PRIORITY_METERS',coverage['missing_priority_meters'])
          with zipfile.ZipFile('scripts/representative_midi_references.zip') as z:
              assert len([p for p in z.namelist() if p.endswith('.mid')])==data['total_files']
          print('VERIFIED_STYLES',data['total_styles'])
          print('VERIFIED_MIDIS',data['total_files'])
          for style,count in data['style_counts'].items():print('STYLE',style,count)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: representative-midi-references
          path: |
            scripts/representative_midi_references.zip
            scripts/reference-output/manifest.json
            scripts/reference-output/README.md
            scripts/reference-output/coverage.json
            scripts/reference-output/COVERAGE.md
          retention-days: 14
