name: Theme-to-song composition checks
on:
  pull_request:
    branches: [feat/song-window-orchestration]
  workflow_dispatch:
jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ai-composer/composition typecheck
      - run: pnpm --filter @ai-composer/composition test
