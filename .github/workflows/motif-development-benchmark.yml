name: Motif-development benchmark
on:
  pull_request:
    branches: [feat/theme-to-song-composer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ai-composer/composition typecheck
      - run: pnpm --filter @ai-composer/composition test
      - name: Export actual MIDI counterfactuals (no ML weights)
        run: python3 experiments/motif-development/export_midis.py --out experiments/motif-development/generated
      - name: Install isolated scoring test dependency
        run: python3 -m pip install 'numpy>=1.26,<3' 'mido>=1.3,<2'
      - name: Verify MIDI pack and synthetic CLaMP score plumbing
        run: |
          python3 -m unittest discover -s experiments/motif-development -p 'test_*.py' -v
          python3 -m py_compile experiments/motif-development/score_clamp3.py
          python3 experiments/motif-development/analyze_midis.py --stimuli experiments/motif-development/generated --out experiments/motif-development/generated/structure_report.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: motif-development-midi-a-e
          path: experiments/motif-development/generated/
          retention-days: 30
