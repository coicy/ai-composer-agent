name: Real CLaMP 3 C2 one-shot CPU probe
on:
  push:
    branches: [experiment/clamp3-c2-real-smoke]
    paths:
      - .github/workflows/clamp3-c2-real-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: real-clamp3-c2-smoke
  cancel-in-progress: true

jobs:
  real-c2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Confirm runner resources
        run: |
          free -h
          df -h .
          python --version
      - name: Export independent MIDI fixtures
        run: python experiments/motif-development/export_midis.py --out experiments/motif-development/generated
      - name: Clone pinned official CLaMP 3
        run: |
          git clone -q --depth 1 https://github.com/sanderwood/clamp3.git /tmp/clamp3
          test "$(git -C /tmp/clamp3 rev-parse HEAD)" = "9016d2b0c8d12d1aa79c2e0ab201e6822bdc83a8"
          sed -i 's/weights_clamp3_saas/weights_clamp3_c2/' /tmp/clamp3/code/config.py
          grep weights_clamp3_c2 /tmp/clamp3/code/config.py
      - name: Install official CLaMP dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/clamp3/requirements.txt 'huggingface_hub>=0.23,<1.0' hf_xet
      - name: Download actual C2 weights and verify official SHA256
        run: |
          python - <<'PY'
          import os,hashlib
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          filename="weights_clamp3_c2_h_size_768_t_model_FacebookAI_xlm-roberta-base_t_length_128_a_size_768_a_layers_12_a_length_128_s_size_768_s_layers_12_p_size_64_p_length_512.pth"
          expected="e6fb0d139b24a1ec20836bb65bd652303d570ea9af2cddb20a1fc161421d64af"
          path=Path(hf_hub_download(repo_id="sander-wood/clamp3",filename=filename))
          h=hashlib.sha256()
          with path.open("rb") as source:
              for data in iter(lambda:source.read(4*1024*1024),b""):h.update(data)
          if h.hexdigest()!=expected:raise RuntimeError("Official C2 weight SHA256 mismatch")
          (Path("/tmp/clamp3/code")/filename).symlink_to(path)
          print("Verified C2 checkpoint",path.stat().st_size,expected)
          PY
      - name: Run actual pretrained C2 on five MIDI + both prompts
        run: |
          python experiments/motif-development/run_clamp3_c2.py \
            --clamp3-root /tmp/clamp3 \
            --stimuli experiments/motif-development/generated \
            --out experiments/motif-development/clamp_cache/live_c2 \
            --expected-checkpoint-sha256 e6fb0d139b24a1ec20836bb65bd652303d570ea9af2cddb20a1fc161421d64af \
            --execute
          cat experiments/motif-development/clamp_cache/live_c2/score_matrix.json
      - name: Collect compact results only (never upload model weights)
        if: always()
        run: |
          mkdir -p live-c2-report
          for file in provenance.json score_matrix.json; do
            if [ -f "experiments/motif-development/clamp_cache/live_c2/$file" ]; then
              cp "experiments/motif-development/clamp_cache/live_c2/$file" "live-c2-report/$file"
            fi
          done
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('live-c2-report/runner_environment.json')
          p.write_text(json.dumps({'runType':'real CLaMP 3 C2 attempted', 'weightsUploaded':False,
            'includesActualModelScores':(Path('live-c2-report/score_matrix.json').is_file())},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-clamp3-c2-result-or-failure-context
          path: live-c2-report/
          retention-days: 14
