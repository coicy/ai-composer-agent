name: Publish Licensed MIDI Reference Snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_midi_reference_catalog.py'
      - 'scripts/stage_reference_snapshot.py'
      - 'scripts/verify_reference_snapshot.py'
      - '.github/workflows/publish-midi-reference-snapshot.yml'

# Publishing to Git needs write access, unlike validation workflows.
# Strictly restrict this job to the repository owner's single curated PR branch.
permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/curated-midi-style-reference-pack' &&
      github.actor == 'coicy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'mido==1.3.3'
      - name: Rebuild original and verified reference MIDI corpus
        run: python scripts/build_midi_reference_catalog.py
      - name: Stage unchanged MIDI files, per-file rights, and full legalcode
        run: python scripts/stage_reference_snapshot.py
      - name: Verify staged Git-ready rights and source hashes
        run: python scripts/verify_reference_snapshot.py
      - name: Commit and push to this repository-owned PR branch only
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Do not push a stale snapshot over subsequent review changes.
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_SHA" || {
            echo 'PR branch advanced; refusing to publish a stale corpus.' >&2
            exit 1
          }
          git add references/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to persistent MIDI reference assets.'
            exit 0
          fi
          echo 'Publishing only versioned third-party reference files and licensing notices'
          git diff --cached --stat
          git commit -m 'data(references): vendor 44 audited MIDI files and third-party licenses'
          git push origin HEAD:"$TARGET_BRANCH"
