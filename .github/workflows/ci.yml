name: CI
on:
  push:
    branches: [main, feat/mcp-reference-guided-composition]
  pull_request:
    branches: [main, feat/mcp-first-stdio-bridge, feat/mcp-midi-reference-lookup]

# Only the newest run for a PR (or main) should consume CI capacity.
# This does not conceal real failures; completed failed checks remain visible.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ai-composer/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ai-composer/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  mcp-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load fixed, independently licensed reference corpus from PR 19
        uses: actions/checkout@v4
        with:
          repository: coicy/ai-composer-agent
          ref: a06a9ed7e091a0480a637648a5396a602b2dfec0
          path: reference-assets
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Run real MCP stdio JSON-RPC subprocess tests with 44 licensed MIDI files
        env:
          AI_COMPOSER_MIDI_CATALOG_PATH: ${{ github.workspace }}/reference-assets/references/catalog/manifest.json
        run: pnpm --filter @ai-composer/agent-api test:mcp-e2e
      - name: Upload actual MCP JSON-RPC request/response transcript
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-stdio-transcript
          path: services/agent-api/test-results/mcp-stdio-transcript.json
          if-no-files-found: warn
          retention-days: 14
