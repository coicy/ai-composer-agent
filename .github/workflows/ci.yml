name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest run for a PR (or main) should consume CI capacity.
# This does not conceal real failures; completed failed checks remain visible.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ai-composer/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ai-composer/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  mcp-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Run real MCP stdio JSON-RPC subprocess tests
        run: pnpm --filter @ai-composer/agent-api test:mcp-e2e
      - name: Upload actual MCP JSON-RPC request/response transcript
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-stdio-transcript
          path: services/agent-api/test-results/mcp-stdio-transcript.json
          if-no-files-found: warn
          retention-days: 14
