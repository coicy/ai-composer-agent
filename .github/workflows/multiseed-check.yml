name: Lightweight multiseed experiment tests
on:
  push:
    branches: [experiment/clamp3-c2-multiseed]
    paths:
      - .github/workflows/multiseed-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install small analysis dependencies (no model)
        run: python -m pip install 'numpy>=1.26,<3' 'mido>=1.3,<2'
      - name: Verify all multiseed fixtures, blinded forms and human/model join
        run: python -m unittest discover -s experiments/motif-development -p 'test_multiseed*.py' -v
